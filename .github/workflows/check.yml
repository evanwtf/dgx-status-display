name: check

on:
  push:
    branches: [main]
  pull_request:

# Public repo: the token can only read. No job needs a secret.
permissions:
  contents: read

jobs:
  # A pull request from a fork never runs on the self-hosted runners: the jobs
  # below skip it. GitHub counts a skipped job as a pass, so this job fails
  # instead, and the PR waits for a maintainer to push the branch here. It
  # runs on a GitHub-hosted runner and checks out no code.
  fork-guard:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "A maintainer must push this branch to the repo to run the checks."
          exit 1

  python:
    # Self-hosted runner: run a pull request only from a branch in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shared runner: scope the uv cache to this run. (The runner context is
      # not allowed in job-level env, so write it to GITHUB_ENV.)
      - run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: ruff
        run: |
          status=0
          uv run --frozen ruff format --check . || status=$?
          uv run --frozen ruff check . || status=$?
          exit "$status"
      - run: uv run --frozen mypy
      # Default run: the NVML integration test skips cleanly (no GPU here).
      - run: uv run --frozen pytest -q -rs
      # Every suite CI can run must run. Deselect the ones it cannot, then
      # fail on any skip in the rest.
      - name: fail on skipped tests
        run: |
          out=$(uv run --frozen pytest -q -rs -m 'not integration and not slow' 2>&1)
          echo "$out"
          if echo "$out" | grep -q SKIPPED; then echo "unexpected skip"; exit 1; fi

  gitleaks:
    # Scan every commit, not only the files: this repo is public.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same gitleaks version as the pre-commit hook, pinned by digest. The
      # mount is read-only. safe.directory: the container user differs from
      # the checkout owner.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner

  firmware:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      # Both steps run in the pinned espressif/idf image (scripts/firmware.py
      # holds the pin), as the runner user, so no root-owned file is left.
      - name: host unit tests (ASan, UBSan)
        run: uv run --frozen python scripts/firmware.py test
      - name: idf.py build
        run: uv run --frozen python scripts/firmware.py build
      - name: size
        run: uv run --frozen python scripts/firmware.py size
      # The UI code, rendered on the host with the same LVGL and config. It
      # fails when a number's last digit changes column between values.
      - name: host preview
        run: uv run --frozen python scripts/firmware.py preview
      - name: fonts regenerate byte for byte
        run: uv run --frozen python scripts/gen_fonts.py --check
      - name: Upload the preview images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ github.sha }}
          path: firmware/preview/*.png
          if-no-files-found: error
          retention-days: 3
      - name: Upload the firmware images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/dgx_status_display.bin
            firmware/build/flash_args
          if-no-files-found: error
          retention-days: 3
