[project]
name = "dgx-status"
version = "0.0.3"
description = "Send DGX Spark status frames over USB serial to an ESP32-C6 AMOLED display."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "nvidia-ml-py>=13.580",
    "pyserial>=3.5",
]

[project.scripts]
dgx-status = "dgx_status.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_status"]

[tool.uv]
# Supply-chain cooldown: resolve only releases at least 7 days old. This
# machine has no global uv.toml, so the repo declares it.
exclude-newer = "P7D"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]   # scripts too: they break silently
mypy_path = "scripts"

[[tool.mypy.overrides]]
# nvidia-ml-py ships no type hints. gpu.py is the only module that imports it.
module = ["pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "integration: needs real hardware (NVML on a DGX); skips when absent",
    "slow: long runs; not part of the default suite",
]
addopts = "-m 'not slow'"            # the default run stays fast and offline
