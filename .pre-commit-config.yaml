# Local mirror of CI. Install once per clone: uv run pre-commit install
repos:
  # The public-repo guard runs first, before any hook can rewrite a file.
  # language: python, not system: it must run from a bare `git commit`, where
  # PATH may lack uv. The script uses the stdlib only. It scans the whole
  # repo, so it ignores the staged file list.
  - repo: local
    hooks:
      - id: public-guard
        name: public-repo guard (no hosts, LAN addresses, home paths, MACs)
        entry: python scripts/check_public.py
        language: python
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # tests/fixtures/ holds files copied byte for byte from a DGX (/proc,
      # /sys). A /proc cmdline ends in a NUL, not a newline. These two hooks
      # rewrite files, so they skip the fixtures. Every checking hook still
      # sees them.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
